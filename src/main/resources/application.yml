spring:
  application:
    name: ecommerce-order-system
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG

jwt:
  secret: ecommerce-secret-key-very-long-and-secure-key-for-jwt-token-generation
  expiration: 86400000  # 24 hours in milliseconds

cors:
  allowed-origins:
    - http://localhost:8000
    - http://localhost:3000
    - http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With
  allow-credentials: true
  max-age: 3600

# 订单相关配置
order:
  # 待支付订单超时时间（分钟），超时后系统自动取消并释放库存
  payment-timeout-minutes: 15
  # 超时订单调度器配置
  timeout-scheduler:
    # 轮询间隔（毫秒），上一轮执行完毕后等待多久开始下一轮
    fixed-delay-ms: 60000
    # 单次批量处理的订单数上限，避免长事务和内存压力
    batch-size: 100
