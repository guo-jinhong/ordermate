spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

logging:
  level:
    root: WARN
    com.ecommerce: INFO

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Requested-With
  allow-credentials: true
  max-age: 3600

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-stacktrace: never
    include-message: never

# 订单相关配置（支持环境变量覆盖，便于运维调参）
order:
  payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
  timeout-scheduler:
    fixed-delay-ms: ${ORDER_TIMEOUT_SCHEDULER_FIXED_DELAY_MS:60000}
    batch-size: ${ORDER_TIMEOUT_SCHEDULER_BATCH_SIZE:100}
