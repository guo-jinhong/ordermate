# OrderMate 前端 Nginx 配置
# 职责：托管 Vue dist + 反代 Agent API + SSE 透传 + 安全门禁 + 限流

# 限流区：按客户端 IP 限流，全局 20 req/s，突发 40
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 传递真实 IP 给后端
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ===== 安全门禁：禁止公网访问管理端点和指标 =====
    location ^~ /admin {
        return 403;
    }
    location = /metrics {
        return 403;
    }
    location ^~ /metrics/ {
        return 403;
    }

    # ===== API 反代到 Agent (agent:8000) =====
    # 精确匹配的 API 路径：不做 SPA fallback，错误直接返回

    # SSE 流式接口：关闭缓冲与缓存，延长读取超时
    location = /chat/stream {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE 关键配置：关闭缓冲，逐帧透传
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 延长超时，支持长连接流式回答
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 不回退到 index.html
        error_page 400 401 403 404 500 502 503 504 = @api_error;
    }

    # 普通 API 路径
    location ~ ^/(health|auth|chat|cart|confirm|operations|conversation)(/|$) {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 90s;
        proxy_send_timeout 60s;

        # API 错误直接返回，不回退到 SPA
        error_page 400 401 403 404 500 502 503 504 = @api_error;
    }

    # API 错误处理：直接返回状态码，不渲染 SPA
    location @api_error {
        default_type application/json;
        return 502 '{"error":"upstream_error","message":"后端服务不可用"}';
    }

    # ===== 原生 FastAPI 页面回退入口 =====
    # 当 Vue 主入口不可用时，可通过 /legacy/ 访问 Agent 原生页面
    location = /legacy {
        return 301 /legacy/;
    }
    location = /legacy/ {
        proxy_pass http://agent:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'href="/static/' 'href="/legacy-static/';
        sub_filter 'src="/static/' 'src="/legacy-static/';
    }
    location ^~ /legacy-static/ {
        proxy_pass http://agent:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ===== SPA 静态资源 + 前端路由 fallback =====
    # 静态资源长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由：只对非 API、非静态资源路径做 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
